<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Маленькое приведение — волшебный лес</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-left">
      <span class="badge">👻 Приведение</span>
      <span id="scoreLabel">Очки: 0 / 5</span>
      <span id="bestLabel">Рекорд: 0</span>
    </div>
    <div class="hud-right">
      <button id="btnStart" type="button" class="btn primary">Старт</button>
      <button id="btnPause" type="button" class="btn" disabled>Пауза</button>
      <button id="btnRestart" type="button" class="btn">Заново</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h2 id="overlayTitle">Маленькое приведение</h2>
        <p id="overlayText">Волшебный лес: собери 5 светлячков, избегай луж и шипов, доберись до портала.</p>
        <button id="overlayBtn" type="button" class="btn primary">Играть</button>
      </div>
    </div>
    <div class="touch-controls" id="touchControls">
      <button type="button" class="tbtn" data-key="left">◀</button>
      <button type="button" class="tbtn" data-key="right">▶</button>
      <button type="button" class="tbtn jump" data-key="jump">⤒</button>
    </div>
  </div>

  <p class="hint">
    Управление: <b>← / A</b> — влево, <b>→ / D</b> — вправо,
    <b>Space / W</b> — прыжок. Собери <b>5 светлячков</b> и войди в <b>портал</b>.
  </p>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
